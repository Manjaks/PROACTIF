structure_name: "data_input_structure"
structure_version: "1.0"
project: "PROACTIF"

description: >
  Input data structure for RTU radar-based occupancy mapping algorithm. 
  The structure supports real sensor and simulation data. 
  Radar is the primary algorithm input. 
  LiDAR is used as ground-truth/reference data for training and validation.

coordinate_convention:
  main_frame: "uav_base_link"
  x_axis: "forward"
  y_axis: "left"
  z_axis: "up"
  units: "meters"
  rotation_units: "radians"

timestamp_convention: 
  unit: "nanoseconds" 
  epoch: "Unix UTC" 
  required_clock_source: "common synchronized system clock" 
  timestamp_definition: > Unless otherwise specified, the timestamp represents the temporal centre of the sensor measurement or acquisition frame. 
  requirement: > All radar, LiDAR, IMU, GNSS, thermal-camera, and UAV-control timestamps shall use the same clock domain.

input_packet:
  header:
    packet_id:
      type: "integer"
      description: "unique sequential identifier of input packet"

    recording_id:
      type: "string"
      description: "identifier of recording session"
      example: "forest_test_2026_01"

    source:
      type: "string"
      allowed_values: 
        - "real" 
        - "simulation" 
        - "replay" 
      example: "real"

  packet_synchronization:
    packet_start_ns:
      type: "integer"
      description: "Earliest sensor timestamp in the input packet."

    packet_end_ns:
      type: "integer"
      description: "Latest sensor timestamp in the input packet."

    max_sensor_time_difference_ms:
      type: "integer"
      description: "Time spread between earliest and latest sensor measurement."

  radar_data:
    type: array
    items:
      sensor_id:
        type: "string"
        examples:
          - "radar_front"
          - "radar_left"
          - "radar_right"
          - "radar_rear"
          - "radar_ground"

      frame_id: 
        type: "string" 
        description: "Coordinate frame in which the radar measurement is defined." 
        example: "radar_front_link"

      timestamp_ns:
        type: "integer"
        description: "Individual radar measurement timestamp."
        example: 0

      tensor:
        shape:
          type: "array_float_4"
          format: "[doppler_bins, range_bins, azimuth_bins, elevation_bins]"
          description: "each cell contains signal reflection power (e.g. dB)"
          example: [64, 256, 107, 37]

        value_type:
          type: "string"
          allowed_values:
            - "float32"
            - "float16"
            - "uint16"
          example: "float32"

        value_quantity: 
          type: "string" 
          allowed_values: 
            - "linear_power" 
            - "log_power_db" 
            - "magnitude" 
            - "normalized_power" 
          description: > 
            Physical or processed meaning of every tensor-cell value. 
          example: "log_power_db"

        tensor_data_reference:
          type: "string"
          description: "Path to binary tensor data."
          example: "radar/radar_front/000001_cube.npy"

        radar_config_reference:
          type: "string"
          description: "Path to radar configuration used to create the tensor"
          example: "radar/radar_front/radar_config.yaml"

  lidar_reference:
    sensor_id:
      type: "string"
      required: false
      example: "lidar_128"

    frame_id: 
      type: "string" 
      example: "lidar_link"

    timestamp_ns:
      type: "integer"

    pointcloud:
      point_fields:
        type: array_float_6
        format: "[x, y, z, i(ntensity), r(ing), t(imestamp)]"
        example: [10, 1, 0.5, 1, 15, 193947839457]

      shape:
        type: "array_int_2"
        format: "[number_of_points, number_of_fields]"
        example: [120000, 6]

      value_type:
        type: "string"
        allowed_values:
          - "float32"
          - "float16"
        example: "float32"

      pointcloud_data_reference:
        type: "string"
        description: "Path to LiDAR point cloud data."
        example: "lidar/000001_pointcloud.npy"

  imu:
    sensor_id: 
      type: "string" 
      example: "imu_01"
    
    frame_id: 
      type: "string" 
      example: "imu_link"

    timestamp_ns:
      type: "integer"

    acceleration_mps:
      type: "array_float_3"
      required: false
      example: [0.0, 0.0, 9.81]

    angular_velocity_radps:
      type: "array_float_3"
      required: false
      example: [0.0, 0.0, 0.0]

    orientation_quaternion_xyzw:
      type: "array_float_4"
      required: false
      example: [0.0, 0.0, 0.0, 1.0]

  gnss_rtk:

    sensor_id: 
      type: "string" 
      example: "gnss_rtk_01"

    timestamp_ns:
      type: "integer"
      example: 0

    latitude_deg: 
      type: "number" 
      example: 56.9496 

    longitude_deg: 
      type: "number" 
      example: 24.1052 

    altitude_m: 
      type: "number" 
      example: 45.2

  thermal_cam:
    type: array
    items:
      sensor_id:
        type: "string"
        examples:
          - "cam_01"
          - "cam-02"
      
      frame_id: 
        type: "string" 
        example: "thermal_front_link"

      timestamp_ns:
        type: "integer"

      value_type:
        type: "string"
        allowed_values:
          - "float32"
          - "float16"
        example: "float32"

      resolution:
        type: "array_int_2"
        order: ["width", "height"]
        example: [1024,768]

      data_reference:
        type: "string"
        example: "thermal/000001_image.jpg"


--------------------------------------------

radar_configuration_minimum_requirements: 
  description: > 
    Every radar_config_reference shall resolve to a machine-readable YAML or JSON configuration containing at least the following information. 
  
  required_fields: 
    - "configuration_id" 
    - "radar_model" 
    - "radar_serial_number" 
    - "frame_rate_hz" 
    - "carrier_frequency_hz" 
    - "doppler_axis_values_mps_or_min_max_resolution" 
    - "range_axis_values_m_or_min_max_resolution" 
    - "azimuth_axis_values_rad_or_min_max_resolution" 
    - "elevation_axis_values_rad_or_min_max_resolution" 
    - "bandwidth" 
    - "adc_sample_rate" 
    - "samples_per_chirp" 
    - "chirps_per_frame" 
    - "number_of_tx_antennas" 
    - "number_of_rx_antennas" 
    - "range_resolution_m" 
    - "doppler_resolution_mps" 
    - "azimuth_resolution_rad" 
    - "elevation_resolution_rad"